name: Codex Maintainer
description: Evidence-grounded issue triage and PR review. Read-only by default.
branding:
  icon: eye
  color: blue
inputs:
  openai-api-key:
    description: OpenAI API key from Actions secrets. Optional only for events that are skipped.
    required: false
  github-token:
    description: Use the default GitHub Actions token; grant write permissions only when comment is enabled.
    required: false
    default: ${{ github.token }}
  model:
    description: Override the configured OpenAI Responses model. Default is gpt-5.3-codex.
    required: false
    default: ''
  pr-number:
    description: Explicit PR number to review (for workflow_dispatch). When set, the event payload is not used for task selection.
    required: false
    default: ''
  base-url:
    description: OpenAI-compatible Responses API base URL. Empty uses https://api.openai.com/v1.
    required: false
    default: ''
  reasoning-effort:
    description: Responses reasoning effort (minimal, low, medium, high, xhigh).
    required: false
    default: 'high'
  max-output-tokens:
    description: Structured Outputs cap (1000-24000). Raise for high reasoning on slower gateways.
    required: false
    default: ''
  max-diff-chars:
    description: Diff evidence budget (1000-300000). Raise to review large PRs.
    required: false
    default: ''
  max-files:
    description: Maximum changed files reviewed (1-200).
    required: false
    default: ''
  max-context-files:
    description: Maximum source excerpts included (1-24).
    required: false
    default: ''
  max-context-chars:
    description: Total source excerpt budget (2000-150000).
    required: false
    default: ''
  max-file-bytes:
    description: Per-file source char cap (1000-100000).
    required: false
    default: ''
  request-timeout-ms:
    description: Per-request timeout in milliseconds (1000-900000). Raise for large prompts on slow gateways.
    required: false
    default: ''
  verbose:
    description: Log request config, response status, token usage and redacted model JSON to the step log.
    required: false
    default: 'false'
  comment:
    description: Explicitly create or update one recommendation comment; never approve, merge, close or modify files.
    required: false
    default: 'false'
  allow-forks:
    description: Opt into fork PR analysis where credentials are available. This does NOT bypass GitHub secret restrictions.
    required: false
    default: 'false'
  allow-external-issues:
    description: Allow issues from non-collaborators to incur OpenAI API usage. Review your budget before enabling.
    required: false
    default: 'false'
outputs:
  status:
    description: completed or skipped; failures fail the step.
    value: ${{ steps.maintain.outputs.status }}
  report-path:
    description: Absolute path to Markdown in runner temporary storage (not automatically uploaded).
    value: ${{ steps.maintain.outputs.report-path }}
  json-path:
    description: Absolute path to the structured JSON report.
    value: ${{ steps.maintain.outputs.json-path }}
  comment-id:
    description: Comment ID when comment was explicitly enabled.
    value: ${{ steps.maintain.outputs.comment-id }}
runs:
  using: composite
  steps:
    - name: Set up the maintainer runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install only the Action's dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if test -f package-lock.json; then
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        else
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --package-lock=false
        fi
    - name: Analyze and report
      id: maintain
      shell: bash
      env:
        CM_ACTION_PATH: ${{ github.action_path }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CM_ACTION_MODEL: ${{ inputs.model }}
        CM_ACTION_PR_NUMBER: ${{ inputs.pr-number }}
        CM_OPENAI_BASE_URL: ${{ inputs.base-url }}
        CM_REASONING_EFFORT: ${{ inputs.reasoning-effort }}
        CM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        CM_MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        CM_MAX_FILES: ${{ inputs.max-files }}
        CM_MAX_CONTEXT_FILES: ${{ inputs.max-context-files }}
        CM_MAX_CONTEXT_CHARS: ${{ inputs.max-context-chars }}
        CM_MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        CM_REQUEST_TIMEOUT_MS: ${{ inputs.request-timeout-ms }}
        CM_VERBOSE: ${{ inputs.verbose }}
        CM_ACTION_COMMENT: ${{ inputs.comment }}
        CM_ACTION_ALLOW_FORKS: ${{ inputs.allow-forks }}
        CM_ACTION_ALLOW_EXTERNAL_ISSUES: ${{ inputs.allow-external-issues }}
      run: node "$CM_ACTION_PATH/dist/action/index.js"
